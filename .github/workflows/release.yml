name: Release

# Push a tag like v1.0.0 to build the installers and publish a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            os: macos-14
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' v_studio/__init__.py | tr -d '\r')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match app version $VERSION"; exit 1
          fi

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libportaudio2 libsndfile1 libegl1 libgl1 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libnss3 libasound2

      - name: Install app and PyInstaller
        run: |
          uv venv --python 3.12 .venv-build
          if [[ "$RUNNER_OS" == "Windows" ]]; then PY=.venv-build/Scripts/python.exe; else PY=.venv-build/bin/python; fi
          echo "PY=$PY" >> "$GITHUB_ENV"
          uv pip install --python "$PY" . "pyinstaller>=6.10"

      - name: Build app
        run: |
          "$PY" -m PyInstaller --noconfirm --distpath build/dist --workpath build/work packaging/v_studio.spec

      - name: Package (macOS .dmg)
        if: runner.os == 'macOS'
        run: bash packaging/macos/build_dmg.sh "${{ steps.ver.outputs.version }}"

      - name: Package (Linux .deb / .tar.gz)
        if: runner.os == 'Linux'
        run: bash packaging/linux/build_deb.sh "${{ steps.ver.outputs.version }}"

      - name: Package (Windows installer)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Compress-Archive -Path build\dist\VStudio -DestinationPath "build\installers\V-Studio-${{ steps.ver.outputs.version }}-Windows-x64-portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: build/installers/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: dist
          merge-multiple: true

      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: softprops/action-gh-release@v2
        with:
          name: V Studio ${{ github.ref_name }}
          files: dist/*
          generate_release_notes: true
          body: |
            ## Download

            | System | File |
            |---|---|
            | macOS (Apple Silicon) | `V-Studio-*-macOS-arm64.dmg` |
            | Windows 10 / 11 | `V-Studio-*-Windows-x64-Setup.exe` (or the portable `.zip`) |
            | Ubuntu / Debian | `V-Studio-*-Linux-amd64.deb` (or the `.tar.gz`) |

            The first launch downloads about 1 GB of voice data, then the app works offline.

            **macOS:** the app is not signed. If macOS says it "cannot be opened", right-click the app → **Open**,
            or run `xattr -cr "/Applications/V Studio.app"`.

            **Windows:** if SmartScreen appears, click **More info → Run anyway**.

            **Linux:** install with `sudo apt install ./V-Studio-*-Linux-amd64.deb`.

