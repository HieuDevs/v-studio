[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "v-studio"
version = "1.1.0"
description = "Desktop app for VieNeu-TTS (Vietnamese text-to-speech)"
requires-python = ">=3.10,<3.14"
dependencies = [
    "vieneu>=3.8",
    "onnxruntime>=1.20,<1.25",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
    "pywebview>=5.0",
    "pywebview[qt]>=5.0; sys_platform == 'linux'",   # Qt WebEngine: no system GTK/WebKit needed
    "truststore>=0.9",
    "pypdf>=4.0",
    "sounddevice>=0.4",
]

[project.optional-dependencies]
watermark = ["vieneu[watermark]"]
cuda = ["vieneu[cuda]"]

[project.scripts]
v-studio = "v_studio.__main__:main"

[tool.setuptools]
packages = ["v_studio"]

[tool.setuptools.package-data]
v_studio = ["ui/*"]
